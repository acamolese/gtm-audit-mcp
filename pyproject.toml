[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gtm-audit"
version = "0.2.0"
description = "MCP server for Google Tag Manager: audit containers, validate GA4/Google Ads/Meta tracking, diff workspaces against versions, export importable container JSON and, in opt-in write mode, apply reviewed changes inside a workspace. Never publishes. For Claude, Cursor, Codex and any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Andrea Camolese" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "google-tag-manager",
    "gtm",
    "tag-manager-api",
    "gtm-audit",
    "tracking-audit",
    "ga4",
    "google-ads",
    "meta-pixel",
    "consent-mode",
    "analytics",
    "claude",
    "claude-code",
    "claude-desktop",
    "cursor",
    "zed",
    "anthropic",
    "llm-tools",
    "ai-tools",
    "report-generator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "mcp>=1.0.0",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/acamolese/gtm-audit-mcp"
Repository = "https://github.com/acamolese/gtm-audit-mcp"
Issues = "https://github.com/acamolese/gtm-audit-mcp/issues"

[project.scripts]
mcp-gtm-audit = "mcp_gtm_audit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gtm_audit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mcp_gtm_audit",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 118
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "DTZ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "DTZ001", "E501"]
"src/mcp_gtm_audit/i18n.py" = ["E501"]
"src/mcp_gtm_audit/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
