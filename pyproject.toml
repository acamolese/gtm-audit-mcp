[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gtm-audit"
version = "0.1.0"
description = "MCP server for Google Tag Manager: inventory containers/tags/triggers/variables, audit common implementation issues, diff workspaces against versions, and validate GA4/Google Ads/Meta tracking from Claude, Cursor, Zed, and any Model Context Protocol client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Andrea Camolese" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "google-tag-manager",
    "gtm",
    "tag-manager-api",
    "gtm-audit",
    "tracking-audit",
    "ga4",
    "google-ads",
    "meta-pixel",
    "consent-mode",
    "analytics",
    "claude",
    "claude-code",
    "claude-desktop",
    "cursor",
    "zed",
    "anthropic",
    "llm-tools",
    "ai-tools",
    "report-generator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "mcp>=1.0.0",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/genoma/mcp-gtm-audit"
Issues = "https://github.com/genoma/mcp-gtm-audit/issues"

[project.scripts]
mcp-gtm-audit = "mcp_gtm_audit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gtm_audit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mcp_gtm_audit",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
